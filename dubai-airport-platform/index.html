<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emirates – Fly Better & DXB Airport Operations</title>
  <meta name="description" content="Emirates Public Passenger Portal, Ticket Booking, User Authentication & DXB OCC Admin Operations Platform">

  <!-- Vazirmatn Font & Responsive Design System Stylesheets -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <!-- Responsive App Viewport Wrapper -->
  <div id="app-viewport">
      
    <!-- Mobile Top Status Bar & Notch (Shown on mobile screens <=768px) -->
    <div class="mobile-status-bar">
      <span>08:30</span>
      <div class="mobile-notch"></div>
      <div style="display: flex; gap: 4px; align-items: center;">
        <span style="font-size: 10px; color: var(--color-gold);">DXB</span>
        <span>100%</span>
      </div>
    </div>

    <!-- Main App Header Bar -->
    <header class="app-header">
      <div class="header-brand" id="brand-logo" onclick="switchRoute('landing')">
        <div class="emirates-badge-icon">EK</div>
        <div class="header-title-text">
          <span class="header-title-main">Emirates – DXB</span>
          <span class="header-title-sub" id="header-subtitle">Fly Better • Dubai International Airport</span>
        </div>
      </div>

      <!-- Route Switcher & Auth Trigger Buttons -->
      <div class="mode-switcher-bar">
        <button class="mode-btn active" id="nav-btn-landing" onclick="switchRoute('landing')">
          ✈ Buy Tickets
        </button>
        <button class="mode-btn" id="nav-btn-auth" onclick="switchRoute('auth')">
          Sign In
        </button>
        <button class="mode-btn admin-badge" id="nav-btn-admin" onclick="switchRoute('admin')">
          ⚙ /admin OCC
        </button>
      </div>
    </header>

    <!-- Public Landing Secondary Sub-Header Bar (Shown in Public Landing Mode) -->
    <nav class="public-nav-strip" id="public-nav-strip">
      <div class="public-nav-links">
        <a class="public-nav-link active" onclick="switchRoute('landing')">Book a Flight</a>
        <a class="public-nav-link" onclick="switchRoute('auth')">My Bookings</a>
        <a class="public-nav-link" onclick="switchRoute('admin')">OCC Admin Operations</a>
      </div>
      <span class="caption-text" style="color: var(--color-gold); font-weight: 600;">DXB Terminal 3 Hub</span>
    </nav>

    <!-- Admin OCC Module Selector Bar (Shown in /admin Mode) -->
    <nav class="module-selector-strip" id="admin-module-strip" style="display: none;">
      <button class="module-chip active" data-module="dashboard">Dashboard</button>
      <button class="module-chip" data-module="crew-flow">CrewFlow</button>
      <button class="module-chip" data-module="aircraft-turnaround">Turnaround</button>
      <button class="module-chip" data-module="gate-management">Gates</button>
      <button class="module-chip" data-module="tower-control">Tower</button>
      <button class="module-chip" data-module="passenger-journey">Passengers</button>
    </nav>

    <!-- Main Screen Content Area -->
    <main id="main-content" class="content-area">
      <!-- Dynamically rendered by js/app.js -->
    </main>

    <!-- Bottom Navigation Bar (Shown on Mobile screens <=768px) -->
    <nav class="bottom-nav">
      <a href="#" class="bottom-nav-item active" data-nav="home">
        <span class="bottom-nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span>
        <span>Book</span>
      </a>

      <a href="#" class="bottom-nav-item" data-nav="auth">
        <span class="bottom-nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Account</span>
      </a>

      <a href="#" class="bottom-nav-item" data-nav="admin">
        <span class="bottom-nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </span>
        <span>/admin</span>
      </a>
    </nav>

  </div>

  <!-- Application Engine JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
